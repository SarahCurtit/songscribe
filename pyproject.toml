[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "songscribe"
version = "0.1.0"
description = "Transcribe chords and lyrics from an audio file into a lead sheet."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Sarah Curtit" }]
keywords = ["music", "chords", "lyrics", "transcription", "mir", "chordpro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Each extra pulls one pretrained open-source model. See MODELS.md.
#
# madmom comes from git, not PyPI: the last release (0.16.1, 2018) does
# `from collections import MutableSequence`, which Python 3.10 removed, so it
# cannot import on any version this project supports. Upstream main fixed that
# and builds cleanly against numpy 2.x. Pinned to a commit, since there is no
# tagged release carrying the fix.
#
# Note: a direct URL dependency makes this extra ineligible for PyPI upload.
# Until madmom cuts a release, `[chords]` installs from a source checkout only.
chords = ["madmom @ git+https://github.com/CPJKU/madmom@27f032e8947204902c675e5e341a3faf5dc86dae"]
lyrics = ["faster-whisper>=1.0"]
separate = ["demucs>=4.0"]
all = ["songscribe[chords,lyrics,separate]"]
dev = [
    "songscribe[chords,lyrics,separate]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
songscribe = "songscribe.cli:main"
songscribe-demo = "songscribe.demo:main"

[project.urls]
Homepage = "https://github.com/SarahCurtit/songscribe"
Issues = "https://github.com/SarahCurtit/songscribe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/songscribe"]

# Required for the git-pinned madmom in the `chords` extra; hatchling refuses
# direct URL references otherwise. See MODELS.md for why the pin exists.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["songscribe"]
